name: Daily tech gaming and space news (Threads & Instagram)

on:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC / 08:47 India time.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (live posting also requires ENABLE_*_POSTING=true)'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: daily-tech-news-social
  cancel-in-progress: false

jobs:
  daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Log workflow run context
        env:
          DRY_RUN: ${{ (vars.ENABLE_THREADS_POSTING != 'true' && vars.ENABLE_INSTAGRAM_POSTING != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          ENABLE_THREADS: ${{ vars.ENABLE_THREADS_POSTING == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM_POSTING == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          echo "Event: ${{ github.event_name }} | Ref: ${{ github.ref_name }} | SHA: ${{ github.sha }}"
          echo "Variables: ENABLE_THREADS_POSTING=${{ vars.ENABLE_THREADS_POSTING || '<unset>' }}, ENABLE_INSTAGRAM_POSTING=${{ vars.ENABLE_INSTAGRAM_POSTING || '<unset>' }}"
          echo "Resolved mode: DRY_RUN=${DRY_RUN}, ENABLE_THREADS=${ENABLE_THREADS}, ENABLE_INSTAGRAM=${ENABLE_INSTAGRAM}"

      - name: Generate or post today's news
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          MAX_NEWS_AGE_HOURS: '72'
          STRICT_SOURCE_MODE: 'true' # Use original publisher wording; no LLM rewrites.
          # Both schedules and manual runs preview unless at least one platform is enabled and dry_run is false.
          DRY_RUN: ${{ (vars.ENABLE_THREADS_POSTING != 'true' && vars.ENABLE_INSTAGRAM_POSTING != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          ENABLE_THREADS: ${{ vars.ENABLE_THREADS_POSTING == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM_POSTING == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python post_daily.py
