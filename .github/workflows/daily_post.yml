name: Daily AI and hardware news (Threads)

on:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC / 08:47 India time.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (live posting also requires ENABLE_THREADS_POSTING=true)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: daily-tech-news-threads
  cancel-in-progress: false

jobs:
  daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Generate or post today's Thread
        env:
          PYTHONUTF8: '1'
          MAX_NEWS_AGE_HOURS: '72'
          # Both schedules and manual runs preview unless live posting is enabled.
          DRY_RUN: ${{ vars.ENABLE_THREADS_POSTING != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python post_daily.py
